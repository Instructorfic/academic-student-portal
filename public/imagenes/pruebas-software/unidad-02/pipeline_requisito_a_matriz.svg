<svg viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline de la Unidad 2: requisito, historia de usuario, criterio de aceptación, escenario, caso de prueba y matriz de trazabilidad">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a3161"/>
    </marker>
  </defs>

  <!-- 5 cajas conectadas -->
  <!-- Requisito -->
  <rect x="10" y="70" width="150" height="80" rx="10" fill="#eaf1fb" stroke="#0a3161" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0a3161">Requisito</text>
  <text x="85" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1c1f24">Bloque 1</text>

  <line x1="162" y1="110" x2="196" y2="110" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Historia / Caso de uso -->
  <rect x="198" y="70" width="150" height="80" rx="10" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/>
  <text x="273" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a6c1a">Historia de</text>
  <text x="273" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a6c1a">usuario / caso</text>
  <text x="273" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#8a6c1a">de uso</text>

  <line x1="350" y1="110" x2="384" y2="110" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Criterio -->
  <rect x="386" y="70" width="150" height="80" rx="10" fill="#e9f5ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="461" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2e7d32">Criterio de</text>
  <text x="461" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2e7d32">aceptación</text>

  <line x1="538" y1="110" x2="572" y2="110" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Escenario -->
  <rect x="574" y="70" width="150" height="80" rx="10" fill="#fbeceb" stroke="#a4342a" stroke-width="2"/>
  <text x="649" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#a4342a">Escenario</text>
  <text x="649" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1c1f24">Bloque 2</text>

  <line x1="726" y1="110" x2="760" y2="110" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Caso de prueba -->
  <rect x="762" y="70" width="105" height="80" rx="10" fill="#eaf1fb" stroke="#0a3161" stroke-width="2"/>
  <text x="814" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a3161">Caso de</text>
  <text x="814" y="121" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0a3161">prueba</text>

  <line x1="869" y1="110" x2="903" y2="110" stroke="#0a3161" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Matriz -->
  <rect x="905" y="55" width="70" height="110" rx="10" fill="#0a3161" stroke="#0a3161" stroke-width="2"/>
  <text x="940" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Matriz</text>
  <text x="940" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">de traza-</text>
  <text x="940" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">bilidad</text>

  <text x="461" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1c1f24">Bloque 3 conecta cada requisito con su escenario y deja prevista la relación con el defecto</text>
</svg>
