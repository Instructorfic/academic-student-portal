<text x="870" y="278" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">total = total + COSTO_ENVIO</text>
<polyline points="870,298 870,338 624,338" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="620" y1="233" x2="620" y2="334" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<text x="638" y="258" text-anchor="start" dominant-baseline="middle" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">No</text>
<circle cx="620" cy="338" r="4" fill="#0b2e59"/>
<line x1="620" y1="342" x2="620" y2="372" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<path d="M440.0,392 L458.0,372 L784.0,372 A16,20 0 0 1 784.0,412 L458.0,412 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="620" y="392" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Total a pagar: $", total</text>
<line x1="620" y1="412" x2="620" y2="436" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="560" y="436" width="120" height="40" rx="20" ry="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="620" y="456" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Fin</text>
