<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 495" width="1080" height="495" role="img" aria-labelledby="t d">
<title id="t">Diagrama de flujo: condicional simple del envío gratis</title>
<desc id="d">Columna izquierda: Inicio; proceso MINIMO_ENVIO_GRATIS = 300; proceso COSTO_ENVIO = 79; salida en pantalla del mensaje Subtotal en pesos; entrada subtotal; conector A. Columna derecha: conector A; proceso total = subtotal; decisión subtotal &lt; MINIMO_ENVIO_GRATIS. Por la rama Sí, proceso total = total + COSTO_ENVIO y regreso al punto de unión. Por la rama No, directo al punto de unión. Después, salida en pantalla del total a pagar; Fin.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2e59"/></marker></defs>
<rect width="1080" height="495" fill="#ffffff"/>
<rect x="140" y="15" width="120" height="40" rx="20" ry="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="35" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Inicio</text>
<line x1="200" y1="55" x2="200" y2="79" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
