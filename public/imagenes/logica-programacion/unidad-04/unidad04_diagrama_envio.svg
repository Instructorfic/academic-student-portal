<text x="200" y="99" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">MINIMO_ENVIO_GRATIS = 300</text>
<line x1="200" y1="119" x2="200" y2="143" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="40.0" y="143" width="320" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="163" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">COSTO_ENVIO = 79</text>
<line x1="200" y1="183" x2="200" y2="207" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<path d="M15.0,227 L33.0,207 L369.0,207 A16,20 0 0 1 369.0,247 L33.0,247 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="227" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Subtotal en pesos: "</text>
<line x1="200" y1="247" x2="200" y2="271" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="93.0,271 325.0,271 307.0,311 75.0,311" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="291" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Entrada: subtotal</text>
<line x1="200" y1="311" x2="200" y2="335" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<circle cx="200" cy="355" r="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="355" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<circle cx="620" cy="35" r="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="620" y="35" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<line x1="620" y1="55" x2="620" y2="79" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="490.0" y="79" width="260" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="620" y="99" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">total = subtotal</text>
<line x1="620" y1="119" x2="620" y2="143" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="620,143 800.0,188.0 620,233 440.0,188.0" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="620" y="188.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">subtotal &lt; MINIMO_ENVIO_GRATIS</text>
<polyline points="800,188 870,188 870,258" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
