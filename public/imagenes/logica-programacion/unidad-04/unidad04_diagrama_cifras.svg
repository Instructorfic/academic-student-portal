<line x1="200" y1="119" x2="200" y2="143" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="98.0,143 320.0,143 302.0,183 80.0,183" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="163" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Entrada: numero</text>
<line x1="200" y1="183" x2="200" y2="207" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="80.0" y="207" width="240" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="227" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">pendiente = numero</text>
<line x1="200" y1="247" x2="200" y2="271" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="80.0" y="271" width="240" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="291" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">suma = 0</text>
<line x1="200" y1="311" x2="200" y2="335" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="80.0" y="335" width="240" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="355" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">cifras = 0</text>
