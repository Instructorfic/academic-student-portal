<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="t d">
<title id="t">Diagrama de flujo: ciclo Mientras de la suma de cifras</title>
<desc id="d">Columna izquierda: Inicio; salida del mensaje Número entero; entrada numero; procesos pendiente = numero, suma = 0 y cifras = 0; conector A. Columna derecha: conector A; decisión pendiente &gt; 0. Rama Sí: procesos suma = suma + pendiente % 10, cifras = cifras + 1 y pendiente = trunc(pendiente / 10), y una línea regresa a la decisión. Rama No: salida en pantalla de la suma y el número de cifras; Fin.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2e59"/></marker></defs>
