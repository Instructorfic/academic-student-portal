<text x="200" y="419" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<circle cx="640" cy="35" r="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="35" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<line x1="640" y1="55" x2="640" y2="79" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="640,79 790.0,124.0 640,169 490.0,124.0" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="124.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">pendiente &gt; 0</text>
