<line x1="640" y1="234" x2="640" y2="258" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="450.0" y="258" width="380" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="278" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">cifras = cifras + 1</text>
<line x1="640" y1="298" x2="640" y2="322" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="450.0" y="322" width="380" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="342" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">pendiente = trunc(pendiente / 10)</text>
<polyline points="640,362 640,386 410,386 410,124 490,124" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="790,124 870,124 870,404 640,404 640,424" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<text x="805" y="108" text-anchor="start" dominant-baseline="middle" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">No</text>
<path d="M410.0,444 L428.0,424 L854.0,424 A16,20 0 0 1 854.0,464 L428.0,464 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="444" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Suma: ", suma, " Cifras: ", cifras</text>
<line x1="640" y1="464" x2="640" y2="488" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="580" y="488" width="120" height="40" rx="20" ry="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="640" y="508" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Fin</text>
</svg>
