<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 550" width="1260" height="550" role="img" aria-labelledby="t d">
<title id="t">Diagrama de flujo: condicional doble del recibo de luz con validación</title>
<desc id="d">Columna izquierda: Inicio; procesos PRECIO_KWH = 1.10 y CARGO_FIJO = 35.00; salida y entrada de lecturaAnterior; salida y entrada de lecturaActual; conector A. Columna derecha: conector A; decisión lecturaActual &gt;= lecturaAnterior. Rama Sí: procesos consumo, importeEnergia y total, y salida de los tres valores. Rama No: salida en pantalla del mensaje Error: lecturas invertidas. Ambas ramas se unen antes de Fin.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2e59"/></marker></defs>
<rect width="1260" height="550" fill="#ffffff"/>
<rect x="140" y="15" width="120" height="40" rx="20" ry="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="35" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Inicio</text>
<line x1="200" y1="55" x2="200" y2="79" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
