<polyline points="645,124 605,124 605,194" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<text x="630" y="108" text-anchor="middle" dominant-baseline="middle" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Sí</text>
<rect x="410.0" y="194" width="390" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="605" y="214" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">consumo = lecturaActual - lecturaAnterior</text>
<line x1="605" y1="234" x2="605" y2="258" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="410.0" y="258" width="390" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="605" y="278" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">importeEnergia = consumo * PRECIO_KWH</text>
<line x1="605" y1="298" x2="605" y2="322" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="410.0" y="322" width="390" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="605" y="342" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">total = importeEnergia + CARGO_FIJO</text>
