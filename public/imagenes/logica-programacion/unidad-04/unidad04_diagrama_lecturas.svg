<text x="605" y="406" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar consumo, importeEnergia, total</text>
<polyline points="605,426 605,466 831,466" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polyline points="1025,124 1065,124 1065,194" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<text x="1040" y="108" text-anchor="middle" dominant-baseline="middle" font-size="14" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">No</text>
<path d="M885.0,214 L903.0,194 L1229.0,194 A16,20 0 0 1 1229.0,234 L903.0,234 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="1065" y="214" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Error: lecturas invertidas"</text>
<polyline points="1065,234 1065,466 839,466" fill="none" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<circle cx="835" cy="466" r="4" fill="#0b2e59"/>
<line x1="835" y1="470" x2="835" y2="494" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="775" y="494" width="120" height="40" rx="20" ry="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="835" y="514" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Fin</text>
</svg>
