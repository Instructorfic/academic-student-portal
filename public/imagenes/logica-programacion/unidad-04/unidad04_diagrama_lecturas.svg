<text x="200" y="483" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<circle cx="835" cy="35" r="20" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="835" y="35" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
