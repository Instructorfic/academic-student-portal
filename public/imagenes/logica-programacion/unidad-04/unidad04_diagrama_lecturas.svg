<line x1="200" y1="119" x2="200" y2="143" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="70.0" y="143" width="260" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="163" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">CARGO_FIJO = 35.00</text>
<line x1="200" y1="183" x2="200" y2="207" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<path d="M10.0,227 L28.0,207 L374.0,207 A16,20 0 0 1 374.0,247 L28.0,247 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="227" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Lectura anterior (kWh): "</text>
<line x1="200" y1="247" x2="200" y2="271" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="78.0,271 340.0,271 322.0,311 60.0,311" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="291" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Entrada: lecturaAnterior</text>
<line x1="200" y1="311" x2="200" y2="335" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<path d="M10.0,355 L28.0,335 L374.0,335 A16,20 0 0 1 374.0,375 L28.0,375 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="355" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar "Lectura actual (kWh): "</text>
<line x1="200" y1="375" x2="200" y2="399" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<polygon points="78.0,399 340.0,399 322.0,439 60.0,439" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="200" y="419" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Entrada: lecturaActual</text>
<line x1="200" y1="439" x2="200" y2="463" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
