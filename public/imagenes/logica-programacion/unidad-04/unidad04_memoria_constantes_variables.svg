<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d">
<title id="t">Constantes y variables en memoria</title>
<desc id="d">Siete celdas de memoria del recibo de luz. Las constantes PRECIO_KWH (1.10) y CARGO_FIJO (35.00) tienen fondo gris y ya tienen valor. Las variables lecturaAnterior, lecturaActual, consumo, importeEnergia y total tienen fondo blanco y su valor es desconocido. Cada celda muestra una dirección ilustrativa.</desc>
