<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-labelledby="t d">
<title id="t">Símbolos de diagrama de flujo de la Unidad III</title>
<desc id="d">Terminal, proceso, entrada (paralelogramo), salida en pantalla (símbolo de pantalla), decisión, línea de flujo y conector, con la instrucción de pseudocódigo que representa cada uno.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2e59"/></marker></defs>
<rect width="1100" height="250" fill="#ffffff"/>
<rect x="20.0" y="60" width="120" height="40" rx="20.0" ry="20.0" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="80.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Inicio</text>
<text x="80.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Terminal</text>
<text x="80.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">Inicio / Fin</text>
<rect x="170.0" y="60" width="130" height="40" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="235.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">x = a + b</text>
<text x="235.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Proceso</text>
<text x="235.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">asignación · constante</text>
<polygon points="338.0,60 460.0,60 442.0,100 320.0,100" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="390.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Entrada: a</text>
<text x="390.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Entrada</text>
<text x="390.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">Entrada:</text>
<path d="M475.0,80.0 L493.0,60.0 L599.0,60.0 A16,20.0 0 0 1 599.0,100.0 L493.0,100.0 Z" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="549.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">Mostrar a</text>
<text x="545.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Salida (pantalla)</text>
<text x="545.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">Mostrar</text>
<polygon points="700.0,42 770.0,80 700.0,118 630.0,80" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="700.0" y="80" text-anchor="middle" dominant-baseline="middle" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="normal" fill="#111">a &gt; b</text>
<text x="700.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Decisión</text>
<text x="700.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">Si · Mientras (Unidad IV)</text>
<line x1="800.0" y1="80" x2="905.0" y2="80" stroke="#0b2e59" stroke-width="2" marker-end="url(#flecha)"/>
<text x="855.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Línea de flujo</text>
<text x="855.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">orden de ejecución</text>
<circle cx="1010.0" cy="80" r="22" fill="#ffffff" stroke="#0b2e59" stroke-width="2"/>
<text x="1010.0" y="80" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">A</text>
<text x="1010.0" y="160" text-anchor="middle" dominant-baseline="middle" font-size="16" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="bold" fill="#111">Conector</text>
<text x="1010.0" y="188" text-anchor="middle" dominant-baseline="middle" font-size="13" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="normal" fill="#111">continuación del flujo</text>
<line x1="0" y1="130" x2="1100" y2="130" stroke="#d0d7e2" stroke-width="1"/>
</svg>
